<div data-role="page" class="page type-interior pluginConfigurationPage"><div data-role="content"><div class="content-primary"><h1>Trickplay Complete</h1><p>该插件只补生成缺失的 Trickplay 分辨率。宽度、间隔、瓦片尺寸、质量和保存位置跟随 Jellyfin 当前配置。</p><p>运行任务：进入“控制面板 → 计划任务 → Complete Missing Trickplay”。任务进度、当前文件和成功/失败统计会显示在计划任务状态与 Jellyfin 日志中。</p><p>插件独立限制：默认并发 1、FFmpeg 线程 2、单视频超时 30 分钟、最大帧数 20000、临时输出上限 2 GiB、连续失败 3 次后暂停自动重试。</p></div></div></div>
