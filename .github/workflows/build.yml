name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Align project with Jellyfin 10.11.11 target
        run: |
          perl -0pi -e 's/<TargetFramework>net8\\.0<\\/TargetFramework>/<TargetFramework>net9.0<\\/TargetFramework>/' src/Jellyfin.Plugin.TrickplayComplete/Jellyfin.Plugin.TrickplayComplete.csproj
          perl -0pi -e 's#<PackageReference Include="Jellyfin\\.Server\\.Implementations"[^>]*/>##g' src/Jellyfin.Plugin.TrickplayComplete/Jellyfin.Plugin.TrickplayComplete.csproj
      - run: dotnet restore src/Jellyfin.Plugin.TrickplayComplete/Jellyfin.Plugin.TrickplayComplete.csproj
      - run: dotnet build src/Jellyfin.Plugin.TrickplayComplete/Jellyfin.Plugin.TrickplayComplete.csproj --configuration Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: trickplay-complete
          path: src/Jellyfin.Plugin.TrickplayComplete/bin/Release/net9.0/Jellyfin.Plugin.TrickplayComplete.dll